[package]
name = "tauri-launcher"
version = "1.0.0"
description = "Pramochak MC Launcher - Tauri v2 + Rust Core Engine"
authors = ["Maheshwar Hari Tripathi <https://github.com/maheshwarkibehan-hub>"]
homepage = "https://github.com/maheshwarkibehan-hub/pramochak-mc-launcher"
repository = "https://github.com/maheshwarkibehan-hub/pramochak-mc-launcher"
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }

